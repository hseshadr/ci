# Reusable PyPI publish — release a Python package with OIDC Trusted Publishing.
#
# ============================ SAME-REPO ONLY =================================
# This reusable workflow serves exactly two purposes, by decision (2026-07-25):
#   1. SAME-REPO use (`uses: ./.github/workflows/python-publish.yml`) or
#      token-based flows, where `job_workflow_ref` names the caller's own repo.
#   2. The CANONICAL TEMPLATE that cross-repo consumers copy INLINE into their
#      own publish.yml — ready-made copies live at examples/edge-proc/publish.yml
#      (single package) and examples/assay/publish.yml (PyPI + npm pair), both
#      taken verbatim from callers with green release runs.
#
# WHY it cannot be called cross-repo: PyPI Trusted Publishing matches the OIDC
# token's `job_workflow_ref`, and for a caller job that
# `uses: hseshadr/ci/.github/workflows/python-publish.yml@<sha>` that ref names
# THIS file — never the caller's publish.yml, which is what the trusted
# publisher is registered against — so every cross-repo call ends in
# "invalid-publisher" (proven by assay's v0.1.1 run 29886472639, 2026-07-21).
# npm is different: ts-publish.yml keeps working cross-repo because npm matches
# the CALLER's workflow filename (proven by privacy-core run 29886074787).
# =============================================================================
#
# WHY OIDC: after a ONE-TIME trusted-publisher registration on PyPI (project →
# Manage → Publishing, or an account-level "pending publisher" for a not-yet-created
# project), every release is `git tag vX.Y.Z && git push --tags` and CI does the rest.
# NO `twine` password, NO PyPI API token stored anywhere. `pypa/gh-action-pypi-publish`
# mints a short-lived OIDC token from GitHub and PyPI verifies it against the registered
# publisher — the workflow filename + repo + owner ARE the credential.
#
# One self-contained job so the built dist and the OIDC identity live together:
#   checkout -> setup-python-uv composite (uv + Python + sync) -> reuse the repo gate
#   (`uv run poe <gate-task>`, skippable) -> `uv build` (sdist + wheel) ->
#   gh-action-pypi-publish (OIDC, attestations on). This mirrors python-gate.yml's
#   "run the exact gate command" contract before it ever ships an artifact.
#
# The CALLER owns the `on: push: tags: ['v*']` trigger (same split as secret-scan /
# security-audit) and must grant `id-token: write` at its job level.
#
# PIN TO A COMMIT SHA, NOT A TAG. Every `uses:` ref here — including first-party
# hseshadr/ci refs — must name a full 40-char commit SHA; tests/security-policy.sh
# rejects a moving `@ci-vN`. That matters most for THIS workflow: it runs with
# `id-token: write`, so a mutable ref anywhere in the chain reaches PyPI.
#
# Same-repo caller (.github/workflows/publish.yml in THIS repository only):
#   name: Publish (PyPI, OIDC)
#   on: { push: { tags: ['v*'] } }
#   permissions: { contents: read }
#   jobs:
#     publish:
#       permissions: { id-token: write, contents: read }
#       uses: ./.github/workflows/python-publish.yml
#       with: { working-directory: "." }
# Cross-repo consumers: do NOT `uses:` this file — copy the inline job from
# examples/edge-proc/publish.yml or examples/assay/publish.yml instead.
name: Python publish (reusable, OIDC, SAME-REPO only)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Dir holding pyproject.toml. '.' for a single-package repo."
        type: string
        default: "."
      python-version:
        description: "Python version to install via uv."
        type: string
        default: "3.13"
      sync-args:
        description: >-
          Extra args appended to `uv sync` before the gate (e.g. '--frozen
          --all-extras', '--locked --group dev'). Same allowlist as
          python-gate. LOCKED BY DEFAULT: must include --frozen or --locked;
          opt out only with the explicit --allow-unlocked sentinel.
        type: string
        default: "--locked"
      gate-task:
        description: "poe task run as the gate before building. Ignored when run-gate is false."
        type: string
        default: "gate"
      run-gate:
        description: "Run the repo gate before building. Leave true unless a prior CI job already gated this ref."
        type: boolean
        default: true
      packages-dir:
        description: "Directory (relative to working-directory) `uv build` writes the sdist + wheel into."
        type: string
        default: "dist"
      attestations:
        description: "Emit PEP 740 attestations (SLSA provenance) with the publish."
        type: boolean
        default: true
      environment:
        description: "Optional GitHub environment to run the publish under (deploy-protection gate)."
        type: string
        default: ""
      runs-on:
        type: string
        default: "ubuntu-latest"
    # No `secrets:` block — publishing is token-free (OIDC). That is the whole point.

# Top-level stays read-only (least privilege + the repo security-policy forbids a
# top-level write). The OIDC `id-token: write` is granted at the job level only.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # OIDC: mint the short-lived token PyPI verifies. This is the credential.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv (+ sync)
        uses: hseshadr/ci/.github/actions/setup-python-uv@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
        with:
          python-version: ${{ inputs.python-version }}
          sync-args: ${{ inputs.sync-args }}
          working-directory: ${{ inputs.working-directory }}

      # Reuse the exact gate the repo runs locally — a package never ships without
      # passing its own quality bar. Skippable when an upstream CI job already gated.
      - name: Gate (uv run poe ${{ inputs.gate-task }})
        if: ${{ inputs.run-gate }}
        working-directory: ${{ inputs.working-directory }}
        env:
          POE_GATE_TASK: ${{ inputs.gate-task }}
        run: |
          if [[ ! "$POE_GATE_TASK" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            echo "::error::Invalid poe gate task: $POE_GATE_TASK"
            exit 1
          fi
          uv run poe "$POE_GATE_TASK"

      - name: Build sdist + wheel
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGES_DIR: ${{ inputs.packages-dir }}
        run: |
          if [[ ! "$PACKAGES_DIR" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::Invalid packages-dir: $PACKAGES_DIR"
            exit 1
          fi
          uv build --out-dir "$PACKAGES_DIR"

      # No `password:` input -> the action publishes via OIDC Trusted Publishing.
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: ${{ inputs.working-directory }}/${{ inputs.packages-dir }}
          attestations: ${{ inputs.attestations }}
          print-hash: true

      # "The upload step exited 0" and "the package exists" are DIFFERENT FACTS, and
      # this pipeline only ever checked the first one. shared-libs-python accumulated
      # six green `Publish (PyPI, OIDC)` runs — one of them titled `Release v0.2.0` —
      # while the package 404'd on PyPI the whole time. The trusted-publisher bootstrap
      # had never been completed and nothing here was capable of noticing.
      # Ask the registry, not the uploader.
      - name: Verify the release is actually on PyPI
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGES_DIR: ${{ inputs.packages-dir }}
        run: |
          if [[ ! "$PACKAGES_DIR" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::Invalid packages-dir: $PACKAGES_DIR"
            exit 1
          fi

          shopt -s nullglob
          sdists=("$PACKAGES_DIR"/*.tar.gz)
          if ((${#sdists[@]} == 0)); then
            echo "::error::No sdist in $PACKAGES_DIR — cannot determine what was published."
            exit 1
          fi

          # PEP 625: the sdist is {name}-{version}.tar.gz, and a PEP 440 version never
          # contains '-', so the last '-' is the split point.
          artifact="$(basename "${sdists[0]}" .tar.gz)"
          raw_name="${artifact%-*}"
          version="${artifact##*-}"
          # PEP 503 normalisation for the URL: lowercase, runs of -_. collapse to '-'.
          name="$(printf '%s' "$raw_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/-/g')"

          url="https://pypi.org/pypi/${name}/${version}/json"
          echo "Verifying ${name}==${version} is served by PyPI..."

          # Registries have propagation delay, so retry — but a timeout is a FAILURE,
          # never a pass.
          #
          # The old bound was 6 attempts 10s apart (~60s) and it was too tight: it
          # failed publishes that had genuinely succeeded. A red run on a live release
          # is not harmless — it teaches the reader to wave off red publish runs, which
          # is exactly how the six-green-while-404 defect comes back. Measured
          # 2026-08-03, time from a green upload until the registry served the version:
          #   PyPI edgeproc-core 0.4.0     >60s   (failed this check while genuinely live)
          #   PyPI edge-proc 0.3.0         ~120s
          #   npm  @edgeproc/errors 0.1.0  ~200s  (first publish of a NEW package name)
          #   npm  @edgeproc/avow 0.3.0    ~60s
          # The first publish of a new name is the slowest case AND the case a real
          # trusted-publisher misconfiguration is indistinguishable from, so the budget
          # must clear propagation by a wide margin before it is allowed to accuse.
          # Bound: 600s of sleep, 3x the slowest measured case. Backoff (5, 10, 15, 30,
          # then 60s) so the common case still verifies in ~15s instead of paying it.
          delays=(5 10 15 30 60 60 60 60 60 60 60 60 60) # 13 sleeps, exactly 600s
          attempts=$((${#delays[@]} + 1))

          for ((i = 0; i < attempts; i++)); do
            if curl -fsS --max-time 15 -o /dev/null "$url"; then
              echo "Verified: ${name}==${version} is live on PyPI."
              exit 0
            fi
            if ((i < ${#delays[@]})); then
              echo "Attempt $((i + 1))/${attempts}: not served yet; retrying in ${delays[i]}s..."
              sleep "${delays[i]}"
            fi
          done

          echo "::error::PUBLISH VERIFICATION FAILED — the upload step reported success, but PyPI does not serve ${name}==${version} (${url}) after ~10 minutes of retrying. A green upload is not proof of a release. Two very different causes land here, so establish which one before touching this run: (1) STILL PROPAGATING — open ${url} yourself; the slowest propagation measured for this portfolio was ~200s, so 10 minutes should be ample, but if it loads now then the release DID happen and this is a false alarm worth reporting. (2) THE RELEASE NEVER HAPPENED — an incomplete PyPI trusted-publisher bootstrap, or a job_workflow_ref/publisher mismatch; the OIDC exchange can look fine while no project is actually registered for this repo+workflow. Check the project's Publishing settings, or the account-level pending publisher, on PyPI. Do not re-run this job merely to make it green."
          exit 1
