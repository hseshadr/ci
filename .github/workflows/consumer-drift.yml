# Consumer drift — does any consumer repository hand-roll a control this repo
# already publishes?
#
# This repository's own CI proves its workflows are internally consistent. It
# proved nothing about whether anyone USES them, which is how five consumers
# each kept a bespoke Cloudflare Pages deploy while cloudflare-pages-deploy.yml
# sat here unused — until one of those copies drifted into a fork-PR deploy
# vulnerability. The bug was in the copy. Publishing a shared control is only
# half the job; noticing that it is not adopted is the other half.
#
# On `pull_request` this guards changes to the detector itself; the daily
# schedule is what catches a consumer drifting after the fact.
name: Consumer drift

on:
  schedule:
    # Daily, off the hour so it does not queue behind everyone else's midnight.
    - cron: "23 7 * * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-drift:
    name: Consumer drift detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The classifier is Ruby; pin the interpreter rather than inherit the
      # runner's default (see .ruby-version).
      # No `ruby-version:` input on purpose — setup-ruby reads .ruby-version by
      # default. Passing `ruby-version-file:` looks more explicit but v1.321.0
      # does not declare that input: it warned "Unexpected input(s)" and ignored
      # it, while the default path silently supplied the right version anyway.
      # An input that does nothing while appearing to be the control is worse
      # than no input.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0

      # Runs first and unconditionally: it needs no token, and a detector whose
      # classifier is broken would otherwise report a clean sweep it never made.
      - name: Validate the classifier in both polarities
        run: tests/consumer-drift-cases.sh

      # A workflow's default GITHUB_TOKEN is scoped to THIS repository only, so
      # every `gh api repos/hseshadr/<consumer>/...` call 404s under it — the
      # sweep would report a spotless portfolio it never actually looked at.
      # Reading other repositories needs CONSUMER_DRIFT_TOKEN: a fine-grained,
      # READ-ONLY PAT with `contents: read` on the seven consumer repositories
      # and nothing else.
      #
      # A MISSING TOKEN USED TO `exit 0` WITH A ::notice::. That made the daily
      # scheduled run report SUCCESS while inspecting nothing, disclosed only by a
      # log line — the job's conclusion, which is the thing anyone actually looks
      # at, said the portfolio was clean. A skip must never be indistinguishable
      # from a pass.
      #
      # The two contexts genuinely differ, so they are treated differently:
      #   schedule / workflow_dispatch — the sweep IS the purpose of the run.
      #     No token means the run had no purpose. FAIL, loudly.
      #   pull_request — the purpose is guarding changes to the detector itself
      #     (the case suite above already ran and is the real gate here), and a
      #     fork PR legitimately cannot see secrets. WARN in the step summary,
      #     where it is visible, and continue.
      - name: Scan the consumer repositories
        env:
          CONSUMER_DRIFT_TOKEN: ${{ secrets.CONSUMER_DRIFT_TOKEN }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ -n "${CONSUMER_DRIFT_TOKEN:-}" ]; then
            GH_TOKEN="$CONSUMER_DRIFT_TOKEN" tests/consumer-drift.sh
            exit $?
          fi

          message="consumer-drift inspected NOTHING — no CONSUMER_DRIFT_TOKEN secret. The default GITHUB_TOKEN cannot read other repositories. Add a fine-grained read-only PAT (contents: read on the consumer repos) to arm the sweep."
          {
            echo "### Consumer drift: NOT RUN"
            echo ""
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TRIGGER" = "pull_request" ]; then
            echo "::warning::$message This is a pull_request run, where the classifier case suite is the gate, so it does not fail the build."
            exit 0
          fi
          echo "::error::$message A scheduled sweep that inspects nothing must not report success."
          exit 1
