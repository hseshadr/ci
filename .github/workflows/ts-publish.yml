# Reusable npm publish — release a TS/JS package with OIDC Trusted Publishing.
#
# WHY OIDC: npm Trusted Publishing (GA 2025-07-31) lets a tagged GitHub Actions run
# publish with NO `NODE_AUTH_TOKEN` write token. After a ONE-TIME registration in the
# package's npm settings ({org/user, repo, this workflow's filename}), every release is
# a `v*` tag push. npm mints a short-lived OIDC token from GitHub and verifies it
# against the registered publisher.
#
# HARD npm truths baked into this design (from docs.npmjs.com/trusted-publishers):
#   * There is NO npm "pending publisher". The package MUST already exist to attach a
#     trusted publisher, so the FIRST publish of a brand-new name (e.g. @gainratio/avow)
#     is unavoidably token/OTP-based; every publish AFTER that is OIDC through here.
#   * `--provenance` writes to a PUBLIC transparency log, so it REQUIRES a PUBLIC source
#     repo. `provenance` defaults TRUE (since 2026-07-25, when the portfolio's publishing
#     repos went public): signing is the default and NOT signing is the thing you have to
#     ask for. A PRIVATE caller must pass `provenance: false` explicitly or the publish
#     fails. The old false default was a silent trap — a caller that simply forgot the
#     input shipped an unsigned release and a perfectly green run. tests/security-policy.sh
#     now rejects that default, and rejects any caller that sets it back to false.
#   * `package.json` `repository.url` MUST exactly match the GitHub repo or OIDC publish
#     fails (ENEEDAUTH). Verify per package before the first OIDC release.
#   * npm >= 11.5.1 is required for OIDC; Node 24 currently ships an older npm, so this
#     workflow upgrades npm before publishing.
#
# One self-contained job: checkout -> setup-node (registry-url for OIDC, no cache) ->
# setup-pnpm composite (reuse; pnpm build+gate toolchain) -> reuse the repo gate ->
# build -> `npm publish` (OIDC). Gate/build run on pnpm; only the publish uses npm.
#
# The CALLER owns the `on: push: tags: ['v*']` trigger and must grant `id-token: write`.
#
# PIN TO A COMMIT SHA, NOT A TAG. Every `uses:` ref here — including first-party
# hseshadr/ci refs — must name a full 40-char commit SHA; tests/security-policy.sh
# rejects a moving `@ci-vN`. That matters most for THIS workflow: it runs with
# `id-token: write`, so a mutable ref anywhere in the chain reaches npm. Copy the
# SHA of the release you want from CHANGELOG.md and keep the trailing version
# comment so Dependabot can bump it. Ready-to-copy callers live in examples/.
#
# Caller (.github/workflows/publish.yml):
#   name: Publish (npm, OIDC)
#   on: { push: { tags: ['v*'] } }
#   permissions: { contents: read }
#   jobs:
#     publish:
#       permissions: { id-token: write, contents: read }
#       uses: hseshadr/ci/.github/workflows/ts-publish.yml@<40-char-sha> # ci-v2.0.1
#       with: { working-directory: ts }
name: TS publish (reusable, OIDC)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Dir holding package.json + pnpm-lock.yaml (e.g. 'ts')."
        type: string
        default: "."
      package-json-file:
        description: "package.json that pins the pnpm version (packageManager field)."
        type: string
        default: "package.json"
      node-version:
        description: "Node major (ignored if node-version-file is set)."
        type: string
        default: "24"
      node-version-file:
        description: "Optional path to a .node-version / .nvmrc (takes precedence)."
        type: string
        default: ""
      cache-dependency-path:
        type: string
        default: "pnpm-lock.yaml"
      install-args:
        type: string
        default: "--frozen-lockfile"
      gate-command:
        description: >-
          Trusted, repository-controlled literal command run from working-directory
          before building. Never derive it from expressions, event data, or untrusted text.
        type: string
        default: "pnpm gate"
      build-command:
        description: >-
          Trusted, repository-controlled literal command that builds the publishable
          artifact. Same trust boundary as gate-command.
        type: string
        default: "pnpm build"
      run-gate:
        description: "Run the repo gate before building. Leave true unless a prior CI job already gated this ref."
        type: boolean
        default: true
      provenance:
        description: >-
          Emit npm provenance (`--provenance`). ON BY DEFAULT. REQUIRES a PUBLIC repo —
          a PRIVATE caller must set this to false explicitly, or the publish fails.
        type: boolean
        default: true
      registry-url:
        description: "npm registry the OIDC publish targets."
        type: string
        default: "https://registry.npmjs.org"
      environment:
        description: "Optional GitHub environment to run the publish under (deploy-protection gate)."
        type: string
        default: ""
      runs-on:
        type: string
        default: "ubuntu-latest"
    secrets:
      # Optional. ONLY needed to install PRIVATE dependencies during gate/build. The
      # publish itself is token-free (OIDC) — never pass a publish/write token here.
      NPM_READ_TOKEN:
        required: false

# Top-level stays read-only; OIDC `id-token: write` is granted at the job level only.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # OIDC: mint the short-lived token npm verifies. This is the credential.
      contents: read
    # Read token (if supplied) authenticates PRIVATE-dep installs. Absent -> empty ->
    # public installs work and the publish falls through to OIDC.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-node runs FIRST to write the registry .npmrc OIDC needs. No cache here
      # (pnpm owns caching); the setup-pnpm composite's own setup-node has no
      # registry-url, so it leaves this .npmrc untouched.
      - name: Configure npm registry for OIDC
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: ${{ inputs.registry-url }}

      - name: Setup pnpm + Node (+ install)
        uses: hseshadr/ci/.github/actions/setup-pnpm@7226072bd02e7aecc5b065b3eaf0bfbf4b3e1790 # ci-v3.2.0
        with:
          package-json-file: ${{ inputs.package-json-file }}
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-args: ${{ inputs.install-args }}
          working-directory: ${{ inputs.working-directory }}

      - name: Gate
        if: ${{ inputs.run-gate }}
        working-directory: ${{ inputs.working-directory }}
        env:
          TRUSTED_COMMAND: ${{ inputs.gate-command }}
        run: bash --noprofile --norc -euo pipefail -c "$TRUSTED_COMMAND"

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          TRUSTED_COMMAND: ${{ inputs.build-command }}
        run: bash --noprofile --norc -euo pipefail -c "$TRUSTED_COMMAND"

      # OIDC needs npm >= 11.5.1; Node 24's bundled npm may be older. Upgrade before
      # publishing. The ad-hoc install is deliberate — npm bootstraps itself and has no
      # lockfile here; it is the npm CLI that performs the OIDC token exchange.
      - name: Ensure OIDC-capable npm
        run: npm install --global npm@latest # zizmor: ignore[adhoc-packages] npm >= 11.5.1 required for OIDC; bootstraps the publish CLI, no lockfile applies

      # No write token -> npm publishes via OIDC Trusted Publishing. `--provenance` is
      # added ONLY when provenance=true (requires a public repo). provenance is passed
      # through an env var, never interpolated into the shell, per the input trust boundary.
      - name: Publish to npm (OIDC Trusted Publishing)
        working-directory: ${{ inputs.working-directory }}
        env:
          NPM_PROVENANCE: ${{ inputs.provenance }}
        run: |
          publish_args=(--access public)
          if [[ "$NPM_PROVENANCE" == "true" ]]; then
            publish_args+=(--provenance)
          fi
          npm publish "${publish_args[@]}"

      # A green `npm publish` is not the same fact as "the registry serves it".
      # Its PyPI twin let six green publish runs stack up on a package that 404'd,
      # because nothing ever asked the registry. Ask the registry.
      - name: Verify the release is actually on npm
        working-directory: ${{ inputs.working-directory }}
        env:
          NPM_REGISTRY_URL: ${{ inputs.registry-url }}
        run: |
          name="$(npm pkg get name | tr -d '"')"
          version="$(npm pkg get version | tr -d '"')"
          if [[ -z "$name" || -z "$version" || "$name" == "undefined" || "$version" == "undefined" ]]; then
            echo "::error::Could not read name/version from package.json — cannot verify the publish."
            exit 1
          fi

          echo "Verifying ${name}@${version} is served by ${NPM_REGISTRY_URL}..."

          # Retry for propagation delay, but a timeout is a FAILURE, never a pass.
          #
          # The old bound was 6 attempts 10s apart (~60s) and it was too tight: it
          # failed publishes that had genuinely succeeded. A red run on a live release
          # is not harmless — it teaches the reader to wave off red publish runs, which
          # is exactly how the six-green-while-404 defect comes back. Measured
          # 2026-08-03, time from a green publish until the registry served the version:
          #   PyPI edgeproc-core 0.4.0     >60s   (failed this check while genuinely live)
          #   PyPI edge-proc 0.3.0         ~120s
          #   npm  @edgeproc/errors 0.1.0  ~200s  (first publish of a NEW package name)
          #   npm  @edgeproc/avow 0.3.0    ~60s
          # The first publish of a new name is the slowest case AND the case a real
          # trusted-publisher misconfiguration is indistinguishable from, so the budget
          # must clear propagation by a wide margin before it is allowed to accuse.
          # Bound: 600s of sleep, 3x the slowest measured case. Backoff (5, 10, 15, 30,
          # then 60s) so the common case still verifies in ~15s instead of paying it.
          delays=(5 10 15 30 60 60 60 60 60 60 60 60 60) # 13 sleeps, exactly 600s
          attempts=$((${#delays[@]} + 1))

          for ((i = 0; i < attempts; i++)); do
            if npm view "${name}@${version}" version --registry "$NPM_REGISTRY_URL" >/dev/null 2>&1; then
              echo "Verified: ${name}@${version} is live on ${NPM_REGISTRY_URL}."
              exit 0
            fi
            if ((i < ${#delays[@]})); then
              echo "Attempt $((i + 1))/${attempts}: not served yet; retrying in ${delays[i]}s..."
              sleep "${delays[i]}"
            fi
          done

          echo "::error::PUBLISH VERIFICATION FAILED — the publish step reported success, but ${NPM_REGISTRY_URL} does not serve ${name}@${version} after ~10 minutes of retrying. A green publish is not proof of a release. Two very different causes land here, so establish which one before touching this run: (1) STILL PROPAGATING — run 'npm view ${name}@${version} version' yourself; the slowest propagation measured for this portfolio was ~200s, on the first publish of a brand-new package name, so 10 minutes should be ample — but if it resolves now then the release DID happen and this is a false alarm worth reporting. (2) THE RELEASE NEVER HAPPENED — an incomplete npm trusted-publisher bootstrap; npm has no 'pending publisher', so the package must already exist before a trusted publisher can be attached, and the first publish of a brand-new name must be token/OTP-based. Confirm the trusted publisher is registered for this repo + workflow filename. Do not re-run this job merely to make it green."
          exit 1
