# This repository publishes security controls, and for a long time it applied almost
# none of them to itself: no gitleaks step anywhere in its own CI while shipping
# secret-scan.yml, and no scheduled run at all. A push-only gate re-audits nothing
# between pushes — zizmor's online audits (known-vulnerable-actions, ref-version-mismatch)
# are checks against a MOVING advisory database, so a workflow that was clean on Monday
# is only known to be clean on Monday. The weekly `schedule` below re-runs this entire
# gate against today's data, and costs nothing to maintain because it duplicates no job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 06:17 UTC — off the hour so it does not queue behind the hourly rush.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Dogfood the brick. `secret-scan.yml` is the single most-copied workflow in the
  # portfolio and this repo — the one that publishes it — was the only repo not running
  # it. A local `./` ref is used deliberately: it always names THIS commit, so the
  # workflow is proven against the version being changed rather than a released SHA.
  #
  # TWO callers, because they answer different questions. The ordinary action
  # scans the event range; the scheduled caller requests the explicit `--all`
  # pass. Measured here before that pass existed: run 31051347230 (push to main)
  # scanned 0 commits and still reported success.
  secret-scan:
    name: Secret scan (own brick) # required status check — do not rename
    # Skipped on the sweep events so the full-history job below is not duplicated.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    # The reusable workflow needs pull-requests: read to list a PR's commits via the API;
    # a caller job may raise a scope the read-only top level does not grant.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/secret-scan.yml

  # The half that actually reads history. `full-history: true` runs an explicit
  # `gitleaks git --log-opts=--all` pass after the action's event-range scan.
  secret-scan-sweep:
    name: Full-history secret sweep (own brick)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Must match the callee, exactly as the job above does. A job-level block
    # REPLACES the top-level one, it does not add to it, so granting only
    # `contents: read` here left `pull-requests` at `none` while secret-scan.yml
    # declares it needs `read`. GitHub refused the whole run: `startup_failure`,
    # ZERO check runs — `Security policy` and `Secret scan (own brick) / gitleaks`
    # were absent from the PR rather than red, and branch protection reads absent
    # as "pending", never "failed". `if:` does not save you: permissions are
    # checked before any condition is evaluated, so the run died on pull_request
    # events where this job would never have started.
    # tests/security-policy.sh::validate_caller_permission_sufficiency compares
    # every caller against its callee statically, because a run that cannot start
    # reports nothing to learn from.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/secret-scan.yml
    with:
      full-history: true

  security-policy:
    name: Security policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags: validate_first_party_release_lineage resolves every
          # hseshadr/ci pin against the newest ci-vX.Y.Z tag, which a shallow clone
          # cannot see.
          fetch-depth: 0
      # 1,300+ lines of this repository's gate logic are Ruby, and until now they
      # ran on whatever the runner happened to ship — an unpinned dependency, the
      # exact class this repo exists to police. .ruby-version is the single source
      # of truth so a local run and a CI run execute the same interpreter.
      # No `ruby-version:` input on purpose — setup-ruby reads .ruby-version by
      # default. Passing `ruby-version-file:` looks more explicit but v1.321.0
      # does not declare that input: it warned "Unexpected input(s)" and ignored
      # it, while the default path silently supplied the right version anyway.
      # An input that does nothing while appearing to be the control is worse
      # than no input.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      - name: Validate CI security policy
        run: |
          bash -n .github/actions/*/*.sh tests/*.sh tests/lib/*.sh
          # -x follows `source`d files (tests/lib/) so they are checked in the
          # context that sources them instead of being SC1091-skipped.
          shellcheck -x .github/actions/*/*.sh tests/*.sh tests/lib/*.sh
          tests/security-policy.sh
      # The lineage guard tolerates one narrow exemption (a release commit may still
      # name the previous release). Whether that exemption stays narrow is not
      # observable from this repository's own history, so it is asserted against
      # synthetic repositories instead.
      - name: Validate the lineage guard's exemption stays narrow
        run: tests/lineage-guard-cases.sh
      # The example-fidelity checker is only worth its runtime if it can say NO.
      # These cases fixture every property in both polarities against a synthetic
      # git repo, so a checker that silently stopped resolving anything cannot
      # look clean. Runs BEFORE the real check (below, via lint-examples.sh) —
      # ORDER IS LOAD-BEARING: a broken checker must be reported as broken, not
      # as a clean examples/ tree.
      - name: Validate the example-fidelity checker in both polarities
        run: tests/example-fidelity-cases.sh
      - name: Install actionlint
        env:
          # v1.7.7
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -fsSL --max-time 60 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: Lint our own workflows (actionlint)
        run: actionlint
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      # GH_TOKEN turns zizmor's ONLINE audits on (known-vulnerable-actions,
      # ref-version-mismatch, ...). Without a token those audits silently skip,
      # which is a quieter gate pretending to be a passing one.
      - name: Audit all workflows and actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx "zizmor@1.26.1" .
      # zizmor and actionlint only collect from .github/workflows/, so neither of
      # the steps above sees a single file in examples/ — the surface consumers
      # actually copy. This stages them into a real workflow layout and audits them.
      - name: Audit the examples consumers copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tests/lint-examples.sh
