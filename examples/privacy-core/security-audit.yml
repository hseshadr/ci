# privacy-core — .github/workflows/security-audit.yml
name: Security audit
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    uses: hseshadr/ci/.github/workflows/security-audit.yml@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
    with:
      run-pnpm-audit: true
      frontend-working-directory: "."
      pnpm-audit-level: moderate
  # THIS is where history gets swept. The same workflow called from ci.yml scans
  # only the commits a push/PR introduced; called here, on a schedule, gitleaks
  # gets no --log-opts and reads every commit. `full-history: true` makes that
  # expectation machine-checked — the job fails if the event cannot deliver it.
  gitleaks:
    name: Secret scan
    # Required, and not optional: secret-scan.yml declares `pull-requests: read`,
    # the top level above grants only `contents: read`, and a caller that grants
    # less than its callee makes GitHub refuse the ENTIRE run — `startup_failure`,
    # zero check runs, so the gate is ABSENT from the PR rather than red.
    permissions:
      contents: read
      pull-requests: read
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
    with:
      full-history: true
