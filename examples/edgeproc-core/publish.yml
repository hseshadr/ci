# shared-libs-python (PyPI package: edgeproc-core) — .github/workflows/publish.yml
# PyPI release via OIDC Trusted Publishing. A `v*` tag push is the whole trigger; there is
# NO PyPI token in this repo.
#
# WHY THE JOB IS INLINE, not a call to the hseshadr/ci reusable workflow (learned from
# assay's v0.1.1 red run 29886472639): PyPI Trusted Publishing matches the OIDC token's
# `job_workflow_ref`, and for a job that `uses:` a CROSS-REPO reusable workflow that ref
# names the ci repo's file (hseshadr/ci/.github/workflows/python-publish.yml) — never
# this repo's publish.yml, which is what the trusted publisher is registered against.
# Cross-repo reuse therefore ALWAYS fails with "invalid-publisher". The job below
# reproduces the hseshadr/ci python-publish.yml steps (ci-v3.0.0; action pins copied
# verbatim) so `job_workflow_ref` names THIS file and the registered publisher matches.
#
# One-time bootstrap (deferred — needs a human): register the GitHub Actions trusted
# publisher on PyPI as a PENDING publisher (edgeproc-core is not yet on PyPI), against
# {owner, edgeproc-core, publish.yml}. After the first OIDC publish creates the project,
# every `git tag vX.Y.Z && git push --tags` releases automatically. The workflow filename
# + repo + owner ARE the credential.
#
# The publish re-runs `uv run poe gate` on the tagged ref before building, so nothing
# ships unless it passes the same gate CI enforces.
#
# NOTE: every `uses:` below is pinned to a full commit SHA, not a moving tag — a tag can
# be repointed at new code, a SHA cannot. The trailing comment records which release that
# SHA is; Dependabot's `github-actions` ecosystem bumps both the pin and the comment.
name: Publish (PyPI, OIDC)
on:
  push:
    tags: ["v*"]
# Top-level read-only; the OIDC write scope is granted on the publish job only (the ci repo
# security policy forbids a top-level `id-token: write`).
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — PyPI verifies this against the registered trusted publisher.
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python + uv (+ sync)
        uses: hseshadr/ci/.github/actions/setup-python-uv@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
        with:
          sync-args: "--frozen --all-extras"

      - name: Gate (uv run poe gate)
        run: uv run poe gate

      - name: Build sdist + wheel
        run: uv build --out-dir dist

      # No `password:` input -> the action publishes via OIDC Trusted Publishing.
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist
          attestations: true
          print-hash: true

      # "The upload step exited 0" and "the package exists" are DIFFERENT FACTS — THIS
      # repo accumulated six green publish runs while the package 404'd on PyPI the
      # whole time. Ask the registry, not the uploader. (Copied from the ci reusable workflow's
      # verify step; kept on purpose in the inline job.)
      - name: Verify the release is actually on PyPI
        run: |
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if ((${#sdists[@]} == 0)); then
            echo "::error::No sdist in dist — cannot determine what was published."
            exit 1
          fi

          # PEP 625: the sdist is {name}-{version}.tar.gz, and a PEP 440 version never
          # contains '-', so the last '-' is the split point.
          artifact="$(basename "${sdists[0]}" .tar.gz)"
          raw_name="${artifact%-*}"
          version="${artifact##*-}"
          # PEP 503 normalisation for the URL: lowercase, runs of -_. collapse to '-'.
          name="$(printf '%s' "$raw_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/-/g')"

          url="https://pypi.org/pypi/${name}/${version}/json"
          echo "Verifying ${name}==${version} is served by PyPI..."

          # Registries have propagation delay, so retry — but a timeout is a FAILURE,
          # never a pass.
          #
          # The old bound was 6 attempts 10s apart (~60s) and it was too tight: it
          # failed publishes that had genuinely succeeded. A red run on a live release
          # is not harmless — it teaches the reader to wave off red publish runs, which
          # is exactly how the six-green-while-404 defect comes back. Measured
          # 2026-08-03, time from a green upload until the registry served the version:
          #   PyPI edgeproc-core 0.4.0     >60s   (failed this check while genuinely live)
          #   PyPI edge-proc 0.3.0         ~120s
          #   npm  @edgeproc/errors 0.1.0  ~200s  (first publish of a NEW package name)
          #   npm  @edgeproc/avow 0.3.0    ~60s
          # The first publish of a new name is the slowest case AND the case a real
          # trusted-publisher misconfiguration is indistinguishable from, so the budget
          # must clear propagation by a wide margin before it is allowed to accuse.
          # Bound: 600s of sleep, 3x the slowest measured case. Backoff (5, 10, 15, 30,
          # then 60s) so the common case still verifies in ~15s instead of paying it.
          delays=(5 10 15 30 60 60 60 60 60 60 60 60 60) # 13 sleeps, exactly 600s
          attempts=$((${#delays[@]} + 1))

          for ((i = 0; i < attempts; i++)); do
            if curl -fsS --max-time 15 -o /dev/null "$url"; then
              echo "Verified: ${name}==${version} is live on PyPI."
              exit 0
            fi
            if ((i < ${#delays[@]})); then
              echo "Attempt $((i + 1))/${attempts}: not served yet; retrying in ${delays[i]}s..."
              sleep "${delays[i]}"
            fi
          done

          echo "::error::PUBLISH VERIFICATION FAILED — the upload step reported success, but PyPI does not serve ${name}==${version} (${url}) after ~10 minutes of retrying. A green upload is not proof of a release. Two very different causes land here, so establish which one before touching this run: (1) STILL PROPAGATING — open ${url} yourself; the slowest propagation measured for this portfolio was ~200s, so 10 minutes should be ample, but if it loads now then the release DID happen and this is a false alarm worth reporting. (2) THE RELEASE NEVER HAPPENED — an incomplete PyPI trusted-publisher bootstrap, or a job_workflow_ref/publisher mismatch; the OIDC exchange can look fine while no project is actually registered for this repo+workflow. Check the project's Publishing settings, or the account-level pending publisher, on PyPI. Do not re-run this job merely to make it green."
          exit 1
