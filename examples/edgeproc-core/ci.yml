# shared-libs-python — .github/workflows/ci.yml
# Uploads coverage to Codecov. For a PRIVATE repo the optional CODECOV_TOKEN is passed
# BY NAME so the upload authenticates (a missing token soft-fails, so CI never goes red
# on the upload). publish.yml (PyPI/npm release) stays repo-local.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    uses: hseshadr/ci/.github/workflows/python-gate.yml@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
    with:
      upload-coverage: true
    # Name the one secret the gate needs. `secrets: inherit` would forward every repo
    # secret — including PyPI/npm credentials — into a workflow that only wants Codecov.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  # ADOPTING THIS RENAMES THE CHECK RUN. A caller job that `uses:` a reusable
  # workflow reports as "<caller job name> / <called job name>" — with the name
  # below that is "Secret scan / gitleaks", not "gitleaks". If a required status
  # check is named after an old inline job, update branch protection in the same
  # move or merges block on a context that will never report again.
  #
  # This scan sees ONLY the commits this push/PR introduced. The full-history
  # sweep is the scheduled caller in security-audit.yml, not this one.
  gitleaks:
    name: Secret scan
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
