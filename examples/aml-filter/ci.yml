# aml-filter — .github/workflows/ci.yml   (frontend-only; STAYS bespoke)
# The single frontend job interleaves a model-weights cache (from a GitHub release),
# a Playwright cache, and 3 e2e lanes — all stateful `uses:` steps a reusable
# workflow can't own. It still re-uses every bit of setup/caching from hseshadr/ci;
# only the `pnpm run gate` line is repo-specific.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: hseshadr/ci/.github/actions/setup-pnpm@2a575cd193e2e1fc093ccd26821020538e2547b7 # ci-v3.0.0
        with:
          package-json-file: frontend/package.json
          node-version-file: frontend/.nvmrc
          cache-dependency-path: frontend/pnpm-lock.yaml
          working-directory: frontend
      # Weights come from a GitHub RELEASE, not a package registry, so the fetch
      # needs GH_TOKEN. Job-level `env:` is what reaches a composite's steps —
      # the composite deliberately takes no secret input.
      - uses: hseshadr/ci/.github/actions/restore-model-cache@2a575cd193e2e1fc093ccd26821020538e2547b7 # ci-v3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-path: frontend/app/public/models
          cache-key: model-weights-${{ runner.os }}-rel1-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}
          working-directory: frontend/app
          fetch-command: |
            dir=public/models/Xenova/all-MiniLM-L6-v2
            mkdir -p "$dir/onnx"
            gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir" --clobber \
              --pattern config.json --pattern tokenizer.json \
              --pattern tokenizer_config.json --pattern special_tokens_map.json
            gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir/onnx" --clobber \
              --pattern model_quantized.onnx
            node scripts/download-model.mjs
      - uses: hseshadr/ci/.github/actions/setup-playwright@2a575cd193e2e1fc093ccd26821020538e2547b7 # ci-v3.0.0
        with:
          working-directory: frontend
          cache-key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Gate (biome -> tsc -> vitest -> build -> 3 e2e lanes)
        working-directory: frontend
        run: pnpm run gate
