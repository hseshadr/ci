# aml-filter — .github/workflows/ci.yml
#
# Two jobs: a shared secret scan, and one irreducibly bespoke frontend job.
#
# The frontend job interleaves a model-weights cache (from a GitHub release), a
# Playwright cache, and 3 e2e lanes — all stateful `uses:` steps a reusable
# workflow can't own, so it STAYS bespoke. It still re-uses every bit of
# setup/caching from hseshadr/ci; only the `pnpm run gate` line is repo-specific.
#
# The gitleaks job is NOT bespoke and this example used to omit it, which is how
# aml-filter came to hand-roll one: on 2026-08-01 it added a PR-triggered secret
# scan by inlining `gitleaks/gitleaks-action`, and the reader who went looking for
# the converged shape of THIS file found no secret-scan job to copy. It is here now.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # ADOPTING THIS RENAMES THE CHECK RUN. A caller job that `uses:` a reusable
  # workflow reports as "<caller job name> / <called job name>" — here
  # "Secret scan / gitleaks", not "gitleaks". If a required status check is named
  # after the old inline job, update branch protection in the same move or merges
  # will block on a context that can no longer report. See the README section
  # "Adopting a reusable workflow renames its check run".
  gitleaks:
    name: Secret scan
    # The reusable workflow lists a PR's commits over the API, which needs
    # pull-requests: read. A caller job may raise a scope the read-only
    # workflow-level default withholds.
    permissions:
      contents: read
      pull-requests: read
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@7226072bd02e7aecc5b065b3eaf0bfbf4b3e1790 # ci-v3.2.0

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: hseshadr/ci/.github/actions/setup-pnpm@7226072bd02e7aecc5b065b3eaf0bfbf4b3e1790 # ci-v3.2.0
        with:
          package-json-file: frontend/package.json
          node-version-file: frontend/.nvmrc
          cache-dependency-path: frontend/pnpm-lock.yaml
          working-directory: frontend
      # Weights come from a GitHub RELEASE, not a package registry, so the fetch
      # needs GH_TOKEN. Job-level `env:` is what reaches a composite's steps —
      # the composite deliberately takes no secret input.
      - uses: hseshadr/ci/.github/actions/restore-model-cache@7226072bd02e7aecc5b065b3eaf0bfbf4b3e1790 # ci-v3.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-path: frontend/app/public/models
          cache-key: model-weights-${{ runner.os }}-rel1-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}
          working-directory: frontend/app
          fetch-command: |
            dir=public/models/Xenova/all-MiniLM-L6-v2
            mkdir -p "$dir/onnx"
            gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir" --clobber \
              --pattern config.json --pattern tokenizer.json \
              --pattern tokenizer_config.json --pattern special_tokens_map.json
            gh release download model-weights-v1 --repo "$GITHUB_REPOSITORY" --dir "$dir/onnx" --clobber \
              --pattern model_quantized.onnx
            node scripts/download-model.mjs
      - uses: hseshadr/ci/.github/actions/setup-playwright@7226072bd02e7aecc5b065b3eaf0bfbf4b3e1790 # ci-v3.2.0
        with:
          working-directory: frontend
          cache-key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Gate (biome -> tsc -> vitest -> build -> 3 e2e lanes)
        working-directory: frontend
        run: pnpm run gate
