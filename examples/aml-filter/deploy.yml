# aml-filter — .github/workflows/deploy.yml   (STAYS bespoke — but shares the deploy half)
# The BUILD is irreducible: clone edge-proc, decode an Ed25519 key, build + sign +
# fail-closed-verify a real sanctions bundle. A reusable workflow can't own those
# injected steps. But the DEPLOY half is not special — it composes pages-deploy-dist,
# the exact same wrangler step edge-reco and almamesh use. Zero deploy duplication.
name: Deploy aml-filter.com
# The suppression below is an EXEMPTION WITH A MACHINE-CHECKED PRECONDITION, not a
# promise: tests/security-policy.sh proves this file's gate actually requires the
# repository pin, `event == 'push'` and `conclusion == 'success'`, and refuses to let
# the suppression cover any trigger other than workflow_run/workflow_dispatch. That
# second half matters — a `# zizmor: ignore[dangerous-triggers]` comment silences the
# audit for the whole `on:` key, so adding `pull_request_target:` here used to make
# zizmor print "No findings to report. Good job!".
on: # zizmor: ignore[dangerous-triggers] deploy-after-CI by design; the triggering run is pinned to this repo + event push + branch main + conclusion success, and no PR code is ever checked out
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-aml-filter
  cancel-in-progress: false
jobs:
  deploy:
    # `branches: [main]` on the trigger is NOT a trust boundary: a fork's default
    # branch is also called `main`, and a fork-PR run reports that name. workflow_run
    # executes in the BASE repo with the BASE repo's secrets, so pin the triggering
    # run to this repository AND to a push before handing it SANCTIONS_SIGNING_KEY_B64.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: hseshadr/ci/.github/actions/setup-pnpm@7226072bd02e7aecc5b065b3eaf0bfbf4b3e1790 # ci-v3.2.0
        with:
          package-json-file: frontend/package.json
          node-version-file: frontend/.nvmrc
          cache-dependency-path: frontend/pnpm-lock.yaml
          working-directory: frontend

      # --- irreducible, repo-specific signing pipeline ---
      #
      # WHY THE KEY IS A FILE AT ALL: @amlfilter/publisher takes the seed as
      # `--key <path>` and offers no stdin or env interface, so an example that
      # piped it in would not drive the tool this repository actually ships.
      # Given a file is required, three properties make it survivable:
      #
      #   1. It lives in $RUNNER_TEMP, OUTSIDE the checkout. A key written under
      #      frontend/ is one `dist-dir` mistake away from being uploaded to a
      #      CDN. $RUNNER_TEMP is never a deploy source.
      #   2. `umask 077` before the write, so it is never group/world readable.
      #   3. The shred is ITS OWN STEP with `if: always()` (below).
      #
      # ORDER IS LOAD-BEARING — do not fold these back into one `run:` block.
      # Verification is fail-closed: it EXITS NON-ZERO on a bad bundle, which is
      # the whole point of it. A trailing `shred` in the same block therefore
      # never runs in exactly the failure the design expects, leaving a
      # production Ed25519 seed on the runner. Split into steps, the cleanup's
      # `if: always()` fires after a failed decode, build, sign, verify OR
      # deploy. This portfolio has already had one committed-seed incident and a
      # full key rotation; this is that lesson written down as YAML.
      - name: Decode the signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.SANCTIONS_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/signing.key"
          size="$(wc -c < "$RUNNER_TEMP/signing.key")"
          [ "$size" -eq 32 ] || { echo "::error::decoded key is $size bytes, expected 32"; exit 1; }

      - name: Build + sign the sanctions bundle
        run: |
          set -euo pipefail
          pnpm -C frontend --filter @amlfilter/publisher run build-real-bundle -- \
            --key "$RUNNER_TEMP/signing.key" \
            --out "$GITHUB_WORKSPACE/frontend/app/public/bundle/origin"

      # Fail-closed: a bundle that does not verify against the pinned public key
      # aborts the deploy rather than shipping.
      - name: Verify the signed bundle against the pinned public key
        run: |
          set -euo pipefail
          pnpm -C frontend --filter @amlfilter/publisher run verify-published-origin -- \
            --base-url "$GITHUB_WORKSPACE/frontend/app/public/bundle/origin" \
            --pubkey "$GITHUB_WORKSPACE/frontend/app/public/public.key"

      # `if: always()` is the entire reason this step exists separately. Removing
      # it, or folding it back into the signing step, re-creates the leak.
      # tests/security-policy.sh asserts both properties.
      - name: Shred the signing key
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/signing.key" ]; then
            shred -f -n 3 -z --remove "$RUNNER_TEMP/signing.key"
          fi

      # --- shared deploy half: identical wrangler step used by every Pages repo ---
      - uses: hseshadr/ci/.github/actions/pages-deploy-dist@7226072bd02e7aecc5b065b3eaf0bfbf4b3e1790 # ci-v3.2.0
        with:
          project-name: aml-filter
          dist-dir: frontend/app/dist
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
