# edge-proc — .github/workflows/ci.yml   (replaces the current ~49-line ci.yml)
# Pure Python library. Calls the shared templates like every other consumer — the
# dedicated hseshadr/ci host means there is NO filename clash and NO local-ref
# special case (the old "rename to security.yml" gotcha is gone).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    uses: hseshadr/ci/.github/workflows/python-gate.yml@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
    with:
      sync-args: "--frozen --all-extras"
  # ADOPTING THIS RENAMES THE CHECK RUN. A caller job that `uses:` a reusable
  # workflow reports as "<caller job name> / <called job name>" — with the name
  # below that is "Secret scan / gitleaks", not "gitleaks". If a required status
  # check is named after an old inline job, update branch protection in the same
  # move or merges block on a context that will never report again.
  #
  # This scan sees ONLY the commits this push/PR introduced. The full-history
  # sweep is the scheduled caller in security-audit.yml, not this one.
  gitleaks:
    name: Secret scan
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
