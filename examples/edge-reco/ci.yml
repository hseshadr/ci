# edge-reco — .github/workflows/ci.yml   (the mixed case: Python backend + pnpm frontend)
#
# gitleaks + backend        -> reusable workflows (clean).
# frontend + e2e            -> STAY bespoke jobs (a model-weights cache is a `uses:`
#                              step a reusable workflow can't own) BUT they re-use
#                              ZERO setup/caching boilerplate: setup-pnpm,
#                              restore-model-cache and setup-playwright are all
#                              composed from hseshadr/ci. Only the two `pnpm run`
#                              gate commands are repo-specific.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  # ADOPTING THIS RENAMES THE CHECK RUN. A caller job that `uses:` a reusable
  # workflow reports as "<caller job name> / <called job name>" — with the name
  # below that is "Secret scan / gitleaks", not "gitleaks". If a required status
  # check is named after an old inline job, update branch protection in the same
  # move or merges block on a context that will never report again.
  #
  # This scan sees ONLY the commits this push/PR introduced. The full-history
  # sweep is the scheduled caller in security-audit.yml, not this one.
  gitleaks:
    name: Secret scan
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1

  quality:
    uses: hseshadr/ci/.github/workflows/python-gate.yml@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
    with:
      working-directory: backend
      sync-args: "--locked --group dev"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: hseshadr/ci/.github/actions/setup-pnpm@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
        with:
          package-json-file: frontend/package.json
          node-version-file: frontend/.nvmrc
          cache-dependency-path: frontend/pnpm-lock.yaml
          working-directory: frontend
      - uses: hseshadr/ci/.github/actions/restore-model-cache@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
        with:
          cache-path: frontend/app/public/models
          cache-key: model-weights-${{ runner.os }}-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}
          fetch-command: node scripts/download-model.mjs
          working-directory: frontend/app
      - name: Gate — quality half
        working-directory: frontend
        run: pnpm run gate:quality

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: hseshadr/ci/.github/actions/setup-pnpm@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
        with:
          package-json-file: frontend/package.json
          node-version-file: frontend/.nvmrc
          cache-dependency-path: frontend/pnpm-lock.yaml
          working-directory: frontend
      - uses: hseshadr/ci/.github/actions/restore-model-cache@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
        with:
          cache-path: frontend/app/public/models
          cache-key: model-weights-${{ runner.os }}-${{ hashFiles('frontend/app/scripts/download-model.mjs') }}
          fetch-command: node scripts/download-model.mjs
          working-directory: frontend/app
      - uses: hseshadr/ci/.github/actions/setup-playwright@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
        with:
          working-directory: frontend
          cache-key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Gate — e2e half
        working-directory: frontend
        run: pnpm run gate:e2e
