# edge-reco — .github/workflows/deploy.yml   (was ~139 lines -> ~18)
# Fits the reusable Pages deploy: the model-weights fetch goes in pre-build-run; the
# only thing lost vs bespoke is the deploy-time weights cache (fine — deploys are rare).
name: Deploy edge-reco.com
# The suppression below is an EXEMPTION WITH A MACHINE-CHECKED PRECONDITION, not a
# promise: tests/security-policy.sh proves this file's gate actually requires the
# repository pin, `event == 'push'` and `conclusion == 'success'`, and refuses to let
# the suppression cover any trigger other than workflow_run/workflow_dispatch. That
# second half matters — a `# zizmor: ignore[dangerous-triggers]` comment silences the
# audit for the whole `on:` key, so adding `pull_request_target:` here used to make
# zizmor print "No findings to report. Good job!".
on: # zizmor: ignore[dangerous-triggers] deploy-after-CI by design; the triggering run is pinned to this repo + event push + branch main + conclusion success, and no PR code is ever checked out
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    # workflow_run fires on COMPLETION, not on success — without this guard a red CI
    # run still deploys. And `branches: [main]` on the trigger is NOT a trust
    # boundary: a fork's default branch is also called `main`, and a fork-PR run
    # reports that name while executing in the BASE repo with the BASE repo's
    # secrets. Pin the triggering run to this repository AND to a push. (The called
    # workflow re-applies the same gate — this keeps the caller safe to copy too.)
    # Mirrors examples/aml-filter/deploy.yml.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) }}
    uses: hseshadr/ci/.github/workflows/cloudflare-pages-deploy.yml@7226072bd02e7aecc5b065b3eaf0bfbf4b3e1790 # ci-v3.2.0
    with:
      project-name: edge-reco
      dist-dir: frontend/app/dist
      install-working-directory: frontend
      pre-build-run: "cd frontend/app && node scripts/download-model.mjs"
      build-command: "pnpm -C frontend -F frontend run build:pages"
      package-json-file: frontend/package.json
      node-version-file: frontend/.nvmrc
      cache-dependency-path: frontend/pnpm-lock.yaml
    # Name the two secrets this deploy actually needs. `secrets: inherit` would hand the
    # called workflow EVERY secret in the repo, including ones it has no business seeing.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
