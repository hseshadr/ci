[project]
name = "python-consumer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["dagger-io"]

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "poethepoet>=0.38.0",
  "pytest>=8.4.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.12.0",
  "xenon>=0.9.3",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PL"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.mypy]
strict = true
python_version = "3.13"
warn_unreachable = true
disallow_any_explicit = true

[tool.poe.tasks]
lint = { shell = "ruff check --fix src && ruff format src" }
typecheck = "mypy --strict src"
complexity = "xenon --max-absolute A --max-modules A --max-average A src"
